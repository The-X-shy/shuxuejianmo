[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-emotion-robustness"
version = "0.1.0"
description = "Reproducible multimodal emotion modeling with missing-modality evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2"]

[project.scripts]
multimodal-emotion = "multimodal_emotion.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
features = ["pandas>=2", "soundfile>=0.12", "opencv-python>=4.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
